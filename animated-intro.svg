<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 80">
  <style>
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes wavingHand {
      0% { transform: rotate(0deg); }
      10% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      30% { transform: rotate(14deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
      60% { transform: rotate(0deg); }
      100% { transform: rotate(0deg); }
    }
    .text {
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;
      fill: #2563EB;
    }
    .hi-there {
      opacity: 0;
      animation: fadeIn 0.8s ease-in-out forwards;
    }
    .name {
      opacity: 0;
      animation: fadeIn 0.8s ease-in-out 0.8s forwards;
    }
    .hand {
      animation: wavingHand 2.5s ease-in-out infinite;
      transform-origin: 70% 70%;
      display: inline-block;
    }
  </style>

  <text x="10" y="40" class="text hi-there">Hi there <tspan class="hand">👋</tspan></text>
  <text x="10" y="70" class="text name">I'm Jen Jose Jeeson</text>
</svg>
